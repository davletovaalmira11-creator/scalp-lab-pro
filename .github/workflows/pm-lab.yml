name: pm-lab
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/pm_lab.py", "reporter.py", ".github/workflows/pm-lab.yml"]
concurrency:
  group: pm-lab
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Research lab (hypotheses, IS/OOS)
        run: timeout 240 python engines/pm_lab.py
        continue-on-error: true
      - name: Unified reporter
        run: python reporter.py
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || (git commit -m "auto: pm lab [skip ci]" && for i in 1 2 3; do git fetch origin && git rebase origin/main && git push origin HEAD:main && break; done)
