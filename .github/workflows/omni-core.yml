name: omni-core
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/okx/**", "engines/pm/**", "engines/evolve/**", ".github/workflows/omni-core.yml"]
concurrency:
  group: omni-core
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r engines/okx/requirements.txt 2>&1 | tail -3
        continue-on-error: true
      - name: OKX trader
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          OKX_DEMO: ${{ secrets.OKX_DEMO }}
          OKX_ORDER_USDT: ${{ vars.OKX_ORDER_USDT }}
          OKX_LEVERAGE: ${{ vars.OKX_LEVERAGE }}
          OKX_MAX_OPEN: ${{ vars.OKX_MAX_OPEN }}
        run: |
          rm -f okx_trader_log.txt
          ( cd engines/okx && timeout 200 python trader.py ) > okx_trader_log.txt 2>&1 || echo "TRADER FAILED (exit $?)" >> okx_trader_log.txt
          tail -30 okx_trader_log.txt
        continue-on-error: true
      - name: Universe scan (auto-discovery ликвидных монет)
        run: |
          rm -f universe_log.txt
          timeout 60 python engines/okx/universe.py > universe_log.txt 2>&1 || echo "UNIVERSE FAILED (exit $?)" >> universe_log.txt
          tail -5 universe_log.txt
        continue-on-error: true
      - name: Multi-TF feed + order books
        run: |
          rm -f feed_log.txt
          timeout 150 python engines/okx/feed.py > feed_log.txt 2>&1 || echo "FEED FAILED (exit $?)" >> feed_log.txt
          tail -12 feed_log.txt
        continue-on-error: true
      - name: Adaptive brain (online ML walk-forward)
        run: |
          rm -f brain_log.txt
          timeout 90 python engines/okx/brain.py > brain_log.txt 2>&1 || echo "BRAIN FAILED (exit $?)" >> brain_log.txt
          tail -10 brain_log.txt
        continue-on-error: true
      - name: Evolve2 (анти-оверфит walk-forward отбор параметров)
        run: |
          rm -f evolve2_log.txt
          timeout 150 python engines/evolve/evolve2.py > evolve2_log.txt 2>&1 || echo "EVOLVE2 FAILED (exit $?)" >> evolve2_log.txt
          tail -10 evolve2_log.txt
        continue-on-error: true
      - name: Polymarket CLOB trader
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_ADDRESS: ${{ secrets.POLY_ADDRESS }}
          POLY_ORDER_USDC: ${{ secrets.POLY_ORDER_USDC }}
          POLY_MIN_EDGE: ${{ secrets.POLY_MIN_EDGE }}
        run: |
          rm -f pm_clob_log.txt
          timeout 60 python engines/pm/clob_trader.py > pm_clob_log.txt 2>&1 || echo "CLOB FAILED (exit $?)" >> pm_clob_log.txt
          tail -10 pm_clob_log.txt
        continue-on-error: true
      - name: Evolve
        run: |
          rm -f evolve_log.txt
          timeout 240 python engines/evolve/researcher.py > evolve_log.txt 2>&1 || echo "EVOLVE FAILED (exit $?)" >> evolve_log.txt
          tail -10 evolve_log.txt
        continue-on-error: true
      - name: Unified reporter
        run: python reporter.py
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add results/ || true
          git add engines/okx/results/ || true
          git add engines/okx/best_params.json || true
          git add okx_trader_log.txt || true
          git add universe_log.txt || true
          git add feed_log.txt || true
          git add brain_log.txt || true
          git add evolve2_log.txt || true
          git add pm_clob_log.txt || true
          git add evolve_log.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: omni core [skip ci]" || true
            for i in 1 2 3; do
              git fetch origin || true
              git rebase origin/main > /dev/null 2>&1 || { git rebase --abort > /dev/null 2>&1 || true; echo "rebase conflict - skip round"; break; }
              git push origin HEAD:main && exit 0
            done
          fi
          exit 0
