name: pm-worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/pm_worker.py", "reporter.py", ".github/workflows/pm-worker.yml"]
concurrency:
  group: pm-worker
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Polymarket live worker
        run: timeout 240 python engines/pm_worker.py
        continue-on-error: true
      - name: Unified reporter
        run: python reporter.py
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || (git commit -m "auto: pm scan [skip ci]" && for i in 1 2 3; do git fetch origin && git rebase origin/main && git push origin HEAD:main && break; done)
