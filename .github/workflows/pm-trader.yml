name: pm-trader
on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/pm/**"]
concurrency:
  group: pm-trader
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install py-clob-client requests
      - name: Polymarket CLOB trader (live при Secrets, иначе тихо skip)
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_ADDRESS: ${{ secrets.POLY_ADDRESS }}
          POLY_ORDER_USDC: ${{ secrets.POLY_ORDER_USDC }}
          POLY_MIN_EDGE: ${{ secrets.POLY_MIN_EDGE }}
        run: timeout 300 python engines/pm/clob_trader.py || echo "clob trader skipped/failed"
        continue-on-error: true
      - name: Unified reporter
        run: python reporter.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add results/clob.json results/universe.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: pm clob trader [skip ci]" || true
            for i in 1 2 3; do
              git fetch origin || true
              git rebase origin/main > /dev/null 2>&1 || { git rebase --abort > /dev/null 2>&1 || true; echo "rebase conflict - skip round"; break; }
              git push origin HEAD:main && exit 0
            done
          fi
          exit 0
