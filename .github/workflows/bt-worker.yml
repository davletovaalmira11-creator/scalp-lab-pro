name: bt-worker
on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch: {}
concurrency:
  group: bt-worker
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engines/scalp/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: engines/scalp
      - uses: actions/cache@v4
        with:
          path: engines/scalp/.cache
          key: omni-bt-cache-v1
      - name: Backtest worker
        run: timeout 2100 python worker.py --budget 32 || echo "worker stopped (budget/cap)"
        working-directory: engines/scalp
        continue-on-error: true
      - name: Scalp reporter
        run: timeout 120 python reporter.py || true
        working-directory: engines/scalp
        continue-on-error: true
      - name: Paper trading
        run: timeout 180 python paper.py || true
        working-directory: engines/scalp
        continue-on-error: true
      - name: Unified reporter
        run: python reporter.py || true
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add engines/scalp/results engines/scalp/reports results || true
          if git status --porcelain | grep -q .; then
            git commit -m "auto: backtest wave [skip ci]" || echo "nothing to commit"
            for i in 1 2 3; do git fetch origin && git rebase origin/main && git push origin HEAD:main && break; done || echo "push failed, will retry next run"
          else
            echo "nothing to commit"
          fi
      - name: Self-trigger next run if work remains
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PENDING=$(jq -r '.pending // 0' engines/scalp/results/progress.json 2>/dev/null || echo 0)
          echo "pending tasks: $PENDING"
          if [ "$PENDING" -gt 0 ] 2>/dev/null; then
            gh workflow run bt-worker.yml --ref main || echo "self-trigger failed, cron will continue"
          else
            echo "queue empty, waiting for cron"
          fi
