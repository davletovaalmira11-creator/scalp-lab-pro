name: okx-trader
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/okx/**", ".github/workflows/okx-trader.yml"]
concurrency:
  group: okx-trader
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r engines/okx/requirements.txt 2>&1 | tee okx_pip_log.txt | tail -3
      - name: OKX trader
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          OKX_DEMO: ${{ secrets.OKX_DEMO }}
          OKX_ORDER_USDT: ${{ vars.OKX_ORDER_USDT }}
          OKX_LEVERAGE: ${{ vars.OKX_LEVERAGE }}
          OKX_MAX_OPEN: ${{ vars.OKX_MAX_OPEN }}
        run: |
          rm -f okx_trader_log.txt
          ( cd engines/okx && timeout 300 python trader.py ) > okx_trader_log.txt 2>&1 || echo "TRADER FAILED (exit $?)" >> okx_trader_log.txt
          tail -40 okx_trader_log.txt
          exit 0
      - name: Unified reporter
        run: python reporter.py || true
      - name: Commit
        if: always()
        run: |
          sleep 20
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add okx_pip_log.txt || true
          git add okx_trader_log.txt || true
          git add results/ || true
          git add engines/okx/results/ || true
          git add engines/okx/best_params.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: okx trader [skip ci]" || true
            for i in 1 2 3 4 5 6; do
              git fetch origin || true
              git rebase origin/main > /dev/null 2>&1 || { git rebase --abort > /dev/null 2>&1 || true; sleep 10; continue; }
              git push origin HEAD:main && exit 0
              sleep 10
            done
          fi
          exit 0
