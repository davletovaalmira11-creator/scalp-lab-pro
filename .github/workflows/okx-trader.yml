name: okx-trader
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engines/okx/**"]
concurrency:
  group: okx-trader
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engines/okx/requirements.txt
      - name: Install deps (лог в файл)
        working-directory: engines/okx
        run: |
          pip install -r requirements.txt 2>&1 | tee pip_log.txt | tail -5
          python -c "import pandas, requests; print('imports ok:', pandas.__version__, requests.__version__)" 2>&1 | tee -a pip_log.txt
      - name: OKX trader (live при Secrets, иначе paper на живых свечах OKX)
        working-directory: engines/okx
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          OKX_DEMO: ${{ secrets.OKX_DEMO }}
          OKX_ORDER_USDT: ${{ vars.OKX_ORDER_USDT }}
          OKX_LEVERAGE: ${{ vars.OKX_LEVERAGE }}
          OKX_MAX_OPEN: ${{ vars.OKX_MAX_OPEN }}
        run: |
          rm -f trader_log.txt
          timeout 300 python trader.py > trader_log.txt 2>&1 || echo "TRADER FAILED (exit $?)" >> trader_log.txt
          cat trader_log.txt | tail -40
          exit 0
      - name: Unified reporter
        run: python reporter.py || true
      - name: Commit
        if: always()
        run: |
          git config user.name "omni-bot"
          git config user.email "omni-bot@users.noreply.github.com"
          git add engines/okx/results engines/okx/trader_log.txt engines/okx/pip_log.txt results/universe.json || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: okx trader [skip ci]" || true
            for i in 1 2 3; do
              git fetch origin || true
              git rebase origin/main > /dev/null 2>&1 || { git rebase --abort > /dev/null 2>&1 || true; echo "rebase conflict - skip round"; break; }
              git push origin HEAD:main && exit 0
            done
          fi
          exit 0
